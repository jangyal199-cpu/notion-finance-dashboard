name: 24/7 Real-Time YouTube to Notion Sync Engine

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Instant YouTube to Notion Sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ECONOMIC_DB_ID: ${{ secrets.ECONOMIC_DB_ID }}
          YOUTUBE_DB_ID: ${{ secrets.YOUTUBE_DB_ID }}
          TELEGRAM_DB_ID: ${{ secrets.TELEGRAM_DB_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node github_actions_cron_runner.js
